<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Jireh Skin Analyzer — nouvelle adresse</title>
<meta http-equiv="refresh" content="0; url=https://mireillembonda-coder.github.io/jireh-skin/">
<style>
  body { font-family: system-ui, sans-serif; background: #FAF7F2; color: #14142B; margin: 0; padding: 40px 16px; text-align: center; }
  a { color: #c2185b; font-weight: 600; }
</style>
</head>
<body>
  <p>Le Skin Analyzer a déménagé.</p>
  <p><a href="https://mireillembonda-coder.github.io/jireh-skin/">Ouvrir la nouvelle adresse</a></p>
<script>
  // Retire l'ancienne version hors ligne installée à cette adresse
  if ('serviceWorker' in navigator) {
    navigator.serviceWorker.getRegistrations().then(function(regs) {
      regs.forEach(function(r) { if (r.scope.indexOf('/discipolat/skin-analyzer/') !== -1) r.unregister(); });
    });
  }
  location.replace('https://mireillembonda-coder.github.io/jireh-skin/');
</script>
</body>
</html>
